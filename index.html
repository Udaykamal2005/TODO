<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6-Month Discipline Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#fff;
      padding:30px;
      min-height:100vh
    }
    header{text-align:center;margin-bottom:20px}
    h1{font-size:2.3rem}
    .date{text-align:center;margin-bottom:20px;opacity:.85}

    .stats{
      display:flex;gap:20px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:25px
    }
    .stat{
      background:rgba(255,255,255,.12);
      padding:15px 25px;
      border-radius:12px;
      min-width:160px;
      text-align:center
    }
    .stat h2{font-size:1.6rem}

    .board{
      max-width:500px;
      margin:auto;
      background:rgba(255,255,255,.14);
      padding:20px;
      border-radius:18px
    }
    .task{
      background:rgba(255,255,255,.18);
      padding:14px;
      border-radius:14px;
      margin-bottom:12px;
      display:flex;
      justify-content:space-between;
      align-items:center
    }
    .task.done{text-decoration:line-through;opacity:.7}

    button{
      background:#4caf50;
      border:none;
      color:#fff;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:.8rem
    }
    button:disabled{background:#777}

    table{
      width:100%;
      margin-top:30px;
      border-collapse:collapse;
      background:rgba(255,255,255,.12);
      border-radius:12px;
      overflow:hidden
    }
    th,td{
      padding:10px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,.2)
    }
    th{background:rgba(0,0,0,.3)}

    canvas{margin-top:35px}
    footer{text-align:center;margin-top:30px;opacity:.8}
  </style>
</head>

<body>

<header>
  <h1>🔥 6-Month Discipline Dashboard</h1>
  <p>Daily reset • History saved • Percentage timeline</p>
</header>

<div class="date" id="today"></div>

<div class="stats">
  <div class="stat"><h2 id="gymP">0%</h2><span>Gym</span></div>
  <div class="stat"><h2 id="dsaP">0%</h2><span>DSA</span></div>
  <div class="stat"><h2 id="webP">0%</h2><span>Web</span></div>
</div>

<div class="board">
  <div class="task" data-type="gym">
    <span>🏋️ Gym – 2 Hours</span>
    <button onclick="completeTask(this)">Complete</button>
  </div>
  <div class="task" data-type="dsa">
    <span>💻 DSA – 1.5 Hours</span>
    <button onclick="completeTask(this)">Complete</button>
  </div>
  <div class="task" data-type="web">
    <span>🌐 Web Dev – 1 Hour</span>
    <button onclick="completeTask(this)">Complete</button>
  </div>
</div>

<h2 style="margin-top:30px;text-align:center">📅 6-Month Daily History</h2>
<table>
  <thead>
    <tr><th>Date</th><th>Gym</th><th>DSA</th><th>Web</th></tr>
  </thead>
  <tbody id="history"></tbody>
</table>

<h2 style="margin-top:35px;text-align:center">📈 6-Month Progress Timeline (%)</h2>
<canvas id="chart" height="130"></canvas>

<footer>Progress auto-saved • New day auto-reset</footer>

<script>
  const today = new Date();
  const todayStr = today.toLocaleDateString();
  document.getElementById("today").innerText = `Today: ${todayStr}`;

  const SIX_MONTHS = 180;

  let data = JSON.parse(localStorage.getItem("sixMonthData")) || {};
  const lastDate = localStorage.getItem("lastDate");

  // 🔁 AUTO RESET FOR NEW DAY
  if (lastDate !== todayStr) {
    data[todayStr] = { gym: 0, dsa: 0, web: 0 };
    localStorage.setItem("lastDate", todayStr);
    localStorage.setItem("sixMonthData", JSON.stringify(data));
  }

  function completeTask(btn) {
    const task = btn.parentElement;
    const type = task.dataset.type;

    if (data[todayStr][type]) return;

    data[todayStr][type] = 1;
    task.classList.add("done");
    btn.innerText = "Done";
    btn.disabled = true;

    save();
  }

  function save() {
    localStorage.setItem("sixMonthData", JSON.stringify(data));
    render();
  }

  function resetTodayUI() {
    document.querySelectorAll(".task").forEach(task => {
      const btn = task.querySelector("button");
      const type = task.dataset.type;

      if (data[todayStr][type] === 0) {
        task.classList.remove("done");
        btn.innerText = "Complete";
        btn.disabled = false;
      }
    });
  }

  function render() {
    const dates = Object.keys(data);
    let gym=0,dsa=0,web=0;

    dates.forEach(d => {
      gym += data[d].gym;
      dsa += data[d].dsa;
      web += data[d].web;
    });

    const totalDays = Math.min(dates.length, SIX_MONTHS);

    document.getElementById("gymP").innerText = ((gym/totalDays)*100).toFixed(1) + "%";
    document.getElementById("dsaP").innerText = ((dsa/totalDays)*100).toFixed(1) + "%";
    document.getElementById("webP").innerText = ((web/totalDays)*100).toFixed(1) + "%";

    const tbody = document.getElementById("history");
    tbody.innerHTML = "";
    dates.slice(-SIX_MONTHS).reverse().forEach(d => {
      tbody.innerHTML += `<tr>
        <td>${d}</td>
        <td>${data[d].gym}</td>
        <td>${data[d].dsa}</td>
        <td>${data[d].web}</td>
      </tr>`;
    });

    drawChart(dates.slice(-SIX_MONTHS));
    resetTodayUI();
  }

  let chart;
  function drawChart(dates) {
    let g=0,d=0,w=0;
    const gP=[],dP=[],wP=[];

    dates.forEach((dt,i) => {
      g += data[dt].gym;
      d += data[dt].dsa;
      w += data[dt].web;

      gP.push(((g/(i+1))*100).toFixed(1));
      dP.push(((d/(i+1))*100).toFixed(1));
      wP.push(((w/(i+1))*100).toFixed(1));
    });

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: dates,
        datasets: [
          { label: "Gym %", data: gP, tension: .4 },
          { label: "DSA %", data: dP, tension: .4 },
          { label: "Web %", data: wP, tension: .4 }
        ]
      },
      options: { scales: { y: { min:0, max:100 } } }
    });
  }

  render();
</script>

</body>
</html>
