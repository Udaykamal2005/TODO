<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month Discipline Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  padding:30px;
}
header{text-align:center;margin-bottom:20px}
.stats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:25px}
.stat{background:rgba(255,255,255,.12);padding:15px 25px;border-radius:12px;min-width:160px;text-align:center}
.board{max-width:500px;margin:auto;background:rgba(255,255,255,.14);padding:20px;border-radius:18px}
.task{background:rgba(255,255,255,.18);padding:14px;border-radius:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.task.done{text-decoration:line-through;opacity:.7}
button{background:#4caf50;border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer}
button:disabled{background:#777}
table{width:100%;margin-top:30px;border-collapse:collapse;background:rgba(255,255,255,.12)}
th,td{padding:10px;text-align:center}
canvas{margin-top:35px}
</style>
</head>

<body>

<header>
<h1>🔥 6-Month Discipline Dashboard</h1>
<p>Auto-updates at 12:00 AM • Clean progress tracking</p>
</header>

<div id="today" style="text-align:center;margin-bottom:15px"></div>

<div class="stats">
  <div class="stat"><h2 id="gymP">0%</h2><span>Gym</span></div>
  <div class="stat"><h2 id="dsaP">0%</h2><span>DSA</span></div>
  <div class="stat"><h2 id="webP">0%</h2><span>Web</span></div>
</div>

<div class="board">
  <div class="task" data-type="gym"><span>🏋️ Gym</span><button onclick="completeTask(this)">Complete</button></div>
  <div class="task" data-type="dsa"><span>💻 DSA</span><button onclick="completeTask(this)">Complete</button></div>
  <div class="task" data-type="web"><span>🌐 Web</span><button onclick="completeTask(this)">Complete</button></div>
</div>

<h2 style="text-align:center;margin-top:30px">📅 Daily History</h2>
<table>
<thead><tr><th>Date</th><th>Gym</th><th>DSA</th><th>Web</th><th>%</th></tr></thead>
<tbody id="history"></tbody>
</table>

<h2 style="text-align:center;margin-top:35px">📈 Daily Progress (%)</h2>
<canvas id="chart" height="120"></canvas>

<script>
function getToday(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split("T")[0];
}

let todayStr = getToday();
document.getElementById("today").innerText = "Today: " + todayStr;

let data = JSON.parse(localStorage.getItem("sixMonthData")) || {};
if(!data[todayStr]) data[todayStr] = {gym:0,dsa:0,web:0};
localStorage.setItem("sixMonthData", JSON.stringify(data));

function midnightWatcher(){
  const newDay = getToday();
  if(newDay !== todayStr){
    todayStr = newDay;
    if(!data[todayStr]) data[todayStr] = {gym:0,dsa:0,web:0};
    localStorage.setItem("sixMonthData", JSON.stringify(data));
    location.reload();
  }
}
setInterval(midnightWatcher, 60000); // check every minute

function completeTask(btn){
  const task = btn.parentElement;
  const type = task.dataset.type;
  if(data[todayStr][type]) return;
  data[todayStr][type] = 1;
  btn.innerText = "Done";
  btn.disabled = true;
  task.classList.add("done");
  localStorage.setItem("sixMonthData", JSON.stringify(data));
  render();
}

function render(){
  const dates = Object.keys(data).sort();
  let g=0,d=0,w=0;

  dates.forEach(dt=>{
    g+=data[dt].gym;
    d+=data[dt].dsa;
    w+=data[dt].web;
  });

  document.getElementById("gymP").innerText = ((g/dates.length)*100).toFixed(1)+"%";
  document.getElementById("dsaP").innerText = ((d/dates.length)*100).toFixed(1)+"%";
  document.getElementById("webP").innerText = ((w/dates.length)*100).toFixed(1)+"%";

  const tbody = document.getElementById("history");
  tbody.innerHTML="";
  dates.slice().reverse().forEach(dt=>{
    const pct = ((data[dt].gym + data[dt].dsa + data[dt].web)/3*100).toFixed(0);
    tbody.innerHTML += `
      <tr>
        <td>${dt}</td>
        <td>${data[dt].gym}</td>
        <td>${data[dt].dsa}</td>
        <td>${data[dt].web}</td>
        <td>${pct}%</td>
      </tr>`;
  });

  document.querySelectorAll(".task").forEach(task=>{
    const type = task.dataset.type;
    const btn = task.querySelector("button");
    if(data[todayStr][type]){
      task.classList.add("done");
      btn.innerText="Done";
      btn.disabled=true;
    }
  });

  drawChart(dates);
}

let chart;
function drawChart(dates){
  const labels = [];
  const values = [];

  dates.forEach(d=>{
    labels.push(d);
    values.push(((data[d].gym + data[d].dsa + data[d].web)/3*100).toFixed(1));
  });

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"Daily Completion %",
        data:values,
        tension:0.35,
        borderWidth:3
      }]
    },
    options:{
      scales:{y:{min:0,max:100}},
      plugins:{legend:{display:false}}
    }
  });
}

render();
</script>

</body>
</html>
